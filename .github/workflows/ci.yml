name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          POSTGRES_DB: logistics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logistics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://logistics:logistics@localhost:5432/logistics
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Module boundaries
        run: uv run lint-imports
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-value-0123456789
          FIELD_ENCRYPTION_KEYS: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DJANGO_ALLOWED_HOSTS: logistics.example
        run: uv run python manage.py check --deploy --fail-level ERROR
      - name: Tests
        run: uv run pytest --create-db

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npx -y npm@11.21.0 ci --no-audit --no-fund
      - name: API types match the API
        run: |
          npm run api-types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::portal/src/api/schema.d.ts is stale; run 'npm run api-types' in portal/ and commit it"; exit 1; }
      - name: Tests
        run: npm test
      - name: Build (type-checks first)
        run: npm run build

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build container image
        run: docker build --tag logistics-suite:ci .
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Deploy scripts
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck deploy/*.sh
      - name: Staging compose overlay and Caddyfile are valid
        run: |
          printf 'POSTGRES_PASSWORD=ci\nDOMAIN=staging.example.com\nACME_EMAIL=ops@example.com\n' > .env
          printf 'RESTIC_REPOSITORY=/tmp/repo\nRESTIC_PASSWORD=ci\n' > backup.env
          docker compose -f compose.yaml -f deploy/compose.staging.yaml --profile ops config --quiet
          docker run --rm -e DOMAIN=staging.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.0 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
