{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3a5f">
  <title>Nuronteq Scanner</title>
  <link rel="manifest" href="{% url 'scanner:manifest' %}">
  <link rel="icon" href="{% static 'scanner/icon.svg' %}">
  <link rel="stylesheet" href="{% static 'scanner/app.css' %}">
</head>
<body data-csrf-cookie="{{ csrf_cookie_name }}" data-sw="{% url 'scanner:sw' %}" data-build="{{ build_id }}">
  <header id="bar">
    <span id="title">Scanner</span>
    <span id="status" role="status" aria-live="polite"></span>
  </header>
  <main id="app"><p class="muted">Loading…</p></main>
  <script src="{% static 'scanner/app.js' %}" defer></script>
</body>
</html>
